[project]
name = "homeiq-ingest"
version = "0.1.0"
description = "HomeIQ Renovation ROI Engine — P0 ingestion and permit-to-parcel spatial join"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyogrio>=0.7",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.14",
    "rapidfuzz>=3.6",
    "usaddress>=0.5.10",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "pyarrow>=15.0",
    "openai>=1.50",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["homeiq_ingest*"]
